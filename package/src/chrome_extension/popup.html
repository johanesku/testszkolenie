<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Course Archiver</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;width:360px;margin:0;padding:16px;background:#fff;color:#171717}
h1{font-size:17px;margin:0 0 12px}.url{font-size:12px;line-height:1.35;background:#f5f5f5;padding:8px;border-radius:8px;word-break:break-all;max-height:70px;overflow:auto}
label{display:block;font-size:12px;margin:12px 0 5px;color:#555}select,button{width:100%;box-sizing:border-box}select{padding:8px;border:1px solid #ccc;border-radius:7px;background:#fff}
button{padding:9px 10px;margin-top:8px;border:0;border-radius:7px;cursor:pointer;background:#202124;color:white;font-weight:600}.secondary{background:#eceff1;color:#202124}.dangerless{background:#3f6fce}.status{font-size:12px;margin-top:10px;min-height:18px;color:#555}.ok{color:#137333}.err{color:#b3261e}
small{display:block;margin-top:10px;color:#777;line-height:1.35}
</style>
</head>
<body>
<h1>Course Archiver Connector</h1>
<div id="url" class="url">Odczytywanie bieżącej karty…</div>
<label for="profile">Profil portalu</label>
<select id="profile"></select>
<button id="open" class="secondary">Otwórz w aplikacji</button>
<button id="login">1. Zaloguj się</button>
<button id="scan" class="dangerless">2. Skanuj strukturę</button>
<button id="run">3. Zrób wszystko (logowanie → transkrypcja)</button>
<div id="status" class="status"></div>
<small>Rozszerzenie przekazuje tylko URL bieżącej karty i nazwę wybranego profilu do lokalnej aplikacji. Login i hasło nie są odczytywane.</small>
<script src="popup.js"></script>
</body>
</html>
